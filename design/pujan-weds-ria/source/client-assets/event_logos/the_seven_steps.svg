<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5D995"/><stop offset=".5" stop-color="#B27D2D"/><stop offset="1" stop-color="#E7C477"/></linearGradient><linearGradient id="brown" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A66A32"/><stop offset="1" stop-color="#75451F"/></linearGradient></defs>
<!-- mandap canopy -->
<path d="M170 245 Q600 15 1030 245" fill="none" stroke="url(#gold)" stroke-width="7"/>
<path d="M210 245 Q600 65 990 245" fill="none" stroke="#D9B66B" stroke-width="3"/>
<path d="M170 245 Q600 390 1030 245" fill="none" stroke="url(#gold)" stroke-width="4"/>
