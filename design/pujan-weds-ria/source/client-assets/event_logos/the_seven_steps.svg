 <path d="M-65 20 Q0 45 65 20 L48 48 Q0 65 -48 48Z" fill="#D9B66B"/>
 <path d="M-34 15 Q-50 -30 -18 -55 Q-8 -28 0 -72 Q28 -32 22 15 Q7 -4 0 -18 Q-8 3 -16 15Z" fill="#E9A34B" stroke="#B77A2E"/>
</g>
<!-- seven vow marks -->
<g fill="url(#gold)"><circle cx="440" cy="555" r="6"/><circle cx="480" cy="555" r="6"/><circle cx="520" cy="555" r="6"/><circle cx="560" cy="555" r="6"/><circle cx="640" cy="555" r="6"/><circle cx="680" cy="555" r="6"/><circle cx="720" cy="555" r="6"/></g>
