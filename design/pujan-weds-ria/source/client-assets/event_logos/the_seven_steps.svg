 <path d="M280 255 V365 M360 270 V390 M840 270 V390 M920 255 V365"/>
 <path d="M265 320 Q280 350 295 320 M345 345 Q360 375 375 345 M825 345 Q840 375 855 345 M905 320 Q920 350 935 320"/>
