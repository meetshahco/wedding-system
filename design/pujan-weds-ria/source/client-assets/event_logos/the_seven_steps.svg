<text x="600" y="405" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="58" letter-spacing="8" fill="#9B672E">THE</text>
<text x="600" y="505" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="112" letter-spacing="2" fill="url(#brown)">Seven Steps</text>
