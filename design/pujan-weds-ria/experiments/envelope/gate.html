<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamari Puri Kahani</title>
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light">
<meta name="darkreader-lock">
<meta name="robots" content="noindex">
<meta property="og:title" content="Hamari Puri Kahani">
<meta property="og:description" content="Please open your personal invitation.">
<style>
  :root { --ink:#3b2a33; --soft:#8a7480; --line:#e7d9df; --accent:#b4568a; --bg:#fbf6f4; color-scheme: light dark; }
  /* Dark mode draws exactly the same palette. The page declares it supports dark so browsers do not force their own darkening. */
  @media (prefers-color-scheme: dark) { :root { --ink:#3b2a33; --soft:#8a7480; --line:#e7d9df; --accent:#b4568a; --bg:#fbf6f4; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { color-scheme: light; }
  body { background: radial-gradient(1200px 600px at 50% -10%, #f6e3ec 0%, var(--bg) 60%); color: var(--ink); font-family: Georgia, "Times New Roman", serif; display: grid; place-items: center; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 380px; text-align: center; }
  .mark { display: inline-block; line-height: 0; margin-bottom: 26px; }
  .mark img { display: block; width: 168px; max-width: 60vw; height: auto; }
  form[hidden] { display: none; }
  h1 { font-size: 30px; font-weight: 400; margin: 0 0 8px; letter-spacing: .02em; }
  p { margin: 0 0 22px; color: var(--soft); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; }
  form { display: grid; gap: 12px; }
  input { width: 100%; font: 600 28px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .5em; text-align: center; padding: 16px 8px 16px calc(8px + .5em); border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #b4568a26; }
  button { font: 600 16px/1 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 20px; margin: 14px 0 0; font-size: 14px; color: #a23b3b; }
  .small { margin-top: 26px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <a class="mark" href="https://myweddingstory.co" target="_blank" rel="noopener noreferrer" aria-label="MyWeddingStory (opens myweddingstory.co)"><img src="/gate/mws-logo.svg" alt="MyWeddingStory" width="168" height="25"></a>
  <h1>Hamari Puri Kahani</h1>
  <p>This invitation is private. Please open your personal link from your WhatsApp message.</p>
  <!-- Guests no longer receive an entry code. The form stays for the couple: add #code to the address to show it. -->
  <form id="f" autocomplete="off" hidden>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" aria-label="Six digit entry code" autofocus>
    <button id="go" type="submit" disabled>Open my invitation</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <p class="small">Cannot find your link? Ask the person who sent you the invitation.</p>
</main>
<script>
  if (location.hash === "#code") document.getElementById("f").hidden = false;
  var pin = document.getElementById("pin"), go = document.getElementById("go"), msg = document.getElementById("msg");
  pin.addEventListener("input", function () { pin.value = pin.value.replace(/\D/g, "").slice(0, 6); go.disabled = pin.value.length !== 6; msg.textContent = ""; });
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    if (pin.value.length !== 6) return;
    go.disabled = true; go.textContent = "Checking";
    fetch("/__gate/unlock", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pin: pin.value }) })
      .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
      .then(function (r) {
        if (r.d && r.d.ok && r.d.redirect) { go.textContent = "Welcome"; location.href = r.d.redirect; return; }
        msg.textContent = r.s === 429 ? "Too many tries. Please wait a few minutes, or use the link from your message." : r.s === 503 ? "Something went wrong on our side. Please try again in a moment." : "That code does not match. Please check your WhatsApp message.";
        go.disabled = false; go.textContent = "Open my invitation"; pin.select();
      })
      .catch(function () { msg.textContent = "No connection. Please try again."; go.disabled = false; go.textContent = "Open my invitation"; });
  });
</script>
</body>
</html>
